joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

# Position control with no PID gains, so gazebo_ros_control falls back to
# Joint::SetPosition: the commanded angle is written straight into the physics
# engine every step. The consequence is that the joints are infinitely stiff and
# the three tolerances below are meaningless, which is why they are disabled or
# very wide. See config/gazebo_controllers_torque.yaml for the torque-driven
# alternative and what it would take to switch.
arm_controller:
  type: position_controllers/JointTrajectoryController
  joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  constraints:
    goal_time: 2.0
    # 0 disables the check. With SetPosition the reported velocity never
    # settles cleanly to zero, and joint_trajectory_controller folds this into
    # the goal tolerance as its velocity component, so every trajectory aborted
    # with a "goal error" message quoting the (tiny) position error instead.
    stopped_velocity_tolerance: 0.0
    # Path tolerance disabled for the same reason: path tracking is not a
    # meaningful signal for a kinematically driven joint, and once
    # gazebo_ros_link_attacher joins a cut cluster to the flange the states
    # deviate from the commanded path anyway.
    #
    # Goal tolerance 0.05 rad, about 60 mm at the CR10's 1.2 m reach. Tighter
    # would be better for the laser, whose spot is 14 mm, but a rigidly
    # attached cluster biases these joints by ~0.07 rad and nothing regulates
    # it. That trade is exactly what torque control removes.
    joint1: {trajectory: 0.0, goal: 0.05}
    joint2: {trajectory: 0.0, goal: 0.05}
    joint3: {trajectory: 0.0, goal: 0.05}
    joint4: {trajectory: 0.0, goal: 0.05}
    joint5: {trajectory: 0.0, goal: 0.05}
    joint6: {trajectory: 0.0, goal: 0.05}
  stop_trajectory_duration: 0.3
  state_publish_rate: 50
  action_monitor_rate: 20
