joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 100

arm_controller:
  type: position_controllers/JointTrajectoryController
  joints: [joint1, joint2, joint3, joint4, joint5, joint6]
  constraints:
    goal_time: 2.0
    # 0 disables the check. gazebo_ros_control drives these joints with
    # Joint::SetPosition (no PID gains are given), so the velocity Gazebo
    # reports never settles cleanly to zero and this tolerance -- which
    # joint_trajectory_controller folds into the *goal* tolerance as its
    # velocity component -- aborts every trajectory with a misleading
    # "goal error" message quoting the (tiny) position error instead.
    stopped_velocity_tolerance: 0.0
    # trajectory (path) tolerance disabled. These joints are driven
    # kinematically by Joint::SetPosition, and once gazebo_ros_link_attacher
    # rigidly joins the cut cluster to the flange the joint states deviate
    # from the commanded path (PATH_TOLERANCE_VIOLATED on joint4). Path
    # tracking is not a meaningful signal for a kinematically driven joint;
    # the goal tolerance below still guards the endpoint.
    # NOTE: 0.12 rad here is known to be too loose for the laser (its spot is
    # ~4 mm and 0.12 rad over a 1.2 m CR10 is ~0.14 m of tool error), but
    # tightening it to 0.01 alone made things worse, not better: the measured
    # tool error at fire time went from 0.54 m to 1.03 m and the arm stopped
    # leaving the stow posture altogether, while execute() still returned
    # success. So the real fault is upstream of the tolerance -- trajectories
    # are reporting success without moving the arm -- and tightening this only
    # changes how far off it ends up. Left at 0.12 until that is found.
    #
    # Original reasoning for widening it to 0.12 for the shear cutter:
    # shear cutter, because a rigidly attached cluster biases the
    # SetPosition-driven joints by ~0.07 rad and the jaws had 96 mm of opening
    # to absorb it. The laser does not: its spot is about 4 mm, and 0.12 rad
    # over a 1.2 m CR10 is ~0.14 m of tool error, so a "successful" move could
    # leave the beam pointing at nothing. Measured on the first laser run: the
    # tool finished 0.54 m from the commanded pose and the controller still
    # reported success.
    #
    # The cut happens BEFORE anything is attached, so the arm is unloaded
    # exactly when accuracy matters. If the post-cut carry starts failing on
    # tolerance, that is the load bias reappearing and it needs handling there,
    # not by blinding the approach.
    joint1: {trajectory: 0.0, goal: 0.12}
    joint2: {trajectory: 0.0, goal: 0.12}
    joint3: {trajectory: 0.0, goal: 0.12}
    joint4: {trajectory: 0.0, goal: 0.12}
    joint5: {trajectory: 0.0, goal: 0.12}
    joint6: {trajectory: 0.0, goal: 0.12}
  stop_trajectory_duration: 0.3
  state_publish_rate: 50
  action_monitor_rate: 20
